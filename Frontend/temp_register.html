<!DOCTYPE html>

        tailwind.config = {

                extend: {
                    "colors": {
                        "inverse-on-surface": "#313030",
                        "on-surface": "#e5e2e1",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "margin-mobile": "24px",
                        "inset-squish": "12px 16px",
                        "inset-button": "18px 24px",
                        "stack-sm": "12px",
                        "stack-md": "24px",
                        "stack-lg": "40px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "button": ["Inter"],
                        "h2": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "h1": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "button": ["16px", {"lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "600"}],
                        "h2": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400"}],
                        "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "label-sm": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "500"}]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #131313; color: #e5e2e1; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .progress-bar {
            height: 2px;
            background: #ffd700;
            width: 30%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 50;
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased overflow-hidden">
<!-- Transactional Progress Indicator -->
<div class="progress-bar"></div>
<main class="flex h-screen w-full">
<!-- Left Column: Editorial Content -->
<section class="hidden lg:flex lg:w-1/2 h-full relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent z-10 opacity-60"></div>
<img class="absolute inset-0 w-full h-full object-cover grayscale contrast-125" data-alt="A high-fashion editorial portrait of a male model wearing an oversized, structured black coat in a minimalist industrial setting. The lighting is moody and high-contrast with deep shadows and sharp highlights, reflecting a premium dark luxury aesthetic. The color palette is dominated by deep blacks and charcoal grays, perfectly aligning with the SNITCH brand identity. The overall atmosphere is sophisticated, quiet, and intensely focused." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBcib3qqOIO7y-UfoeVsrrTtPD5dooMWULb2bbA_EV8QEUKuOmgRm_en91mc7Hv8Q0x5rS73pXQYvy2t7rTGtrv6x3DKLJK3Lx7-B2njyYzQk1toyBzGPkbtAV8SbeAft5tKGLJa5ShLxEsMQehYrrZjPcyhnhBaeEwVvrfMOpD1Y6w0S14LTuntoyHcc8p70iWbSXvRFT1V6GIMVj4f93-odnYdY_CyypoN1mold9PJIi7kOGqi23PlnHEVslZLDpa3l0KIBe9fe8p"/>
<div class="z-20 self-end p-stack-lg w-full">
<h1 class="font-h1 text-h1 font-bold tracking-widest text-on-surface mb-unit">SNITCH</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md">The modern blueprint for premium street apparel and editorial design.</p>
</div>
</section>
<!-- Right Column: Registration Form -->
<section class="w-full lg:w-1/2 h-full bg-surface flex flex-col justify-center items-center px-margin-mobile md:px-stack-lg overflow-y-auto">
<div class="w-full max-w-md py-stack-lg">
<!-- Brand Header for Mobile/Focused Context -->
<header class="mb-stack-lg lg:hidden">
<h1 class="font-h1 text-h1 font-bold tracking-widest text-on-surface text-center">SNITCH</h1>
</header>
<div class="space-y-stack-sm mb-stack-lg">
<h2 class="font-h2 text-h2 text-on-surface">Create your account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Join the studio for early access and exclusive drops.</p>
</div>
<form class="space-y-stack-md">
<!-- Name Field -->
<div class="space-y-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant block">Full Name</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-inset-squish text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" placeholder="Enter your full name" type="text"/>
</div>
<!-- Email Field -->
<div class="space-y-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant block">Email Address</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-inset-squish text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" placeholder="name@example.com" type="email"/>
</div>
<!-- Contact Field -->
<div class="space-y-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant block">Contact Number</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-inset-squish text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<!-- Password Field -->
<div class="space-y-unit relative">
<label class="font-label-sm text-label-sm text-on-surface-variant block">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-inset-squish text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all pr-12" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Checkbox -->
<div class="flex items-center gap-unit py-unit">
<div class="relative flex items-center">
<input class="appearance-none h-5 w-5 bg-surface-container-low border border-outline-variant rounded checked:bg-primary-container checked:border-primary-container focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-surface transition-all cursor-pointer" id="sell" type="checkbox"/>
<span class="material-symbols-outlined absolute pointer-events-none text-on-primary text-sm opacity-0 check-icon transition-opacity" data-icon="check" data-weight="fill">check</span>
</div>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer select-none" for="sell">I want to sell</label>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary-container text-on-primary font-button text-button p-inset-button rounded-lg hover:opacity-90 active:scale-[0.98] transition-all duration-300" type="submit">
                        Sign Up
                    </button>
</form>
<!-- Divider -->
<div class="relative my-stack-lg">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-surface-container-highest"></div></div>
<div class="relative flex justify-center text-label-sm"><span class="bg-surface px-unit text-on-surface-variant font-label-sm uppercase tracking-widest">or</span></div>
</div>
<!-- Social Login -->
<button class="w-full flex items-center justify-center gap-unit bg-transparent border border-outline-variant rounded-lg p-inset-squish font-button text-button text-on-surface hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBUi3dlk2apDuFLFccOhZdkYP1Z5WdSgcCJenFX4nYCEzf_ojJv51rrsCytR3glcWiGOybSpaSGrsUgHac9TEJJbyQfFDDavfCG6iuLoP6QmsJQwMlFT8s6sLxOYRq--yCM1n8q6K3J5Yw2ODbOGRuNTzJtD_P0engJ9NWQxkFOoiRQxcujZLQB9EwZ_rJ2bERPIyw7kcBnuXN8ydNrffTFD5JfT0bNC7LRgEtOrPYtlEsiZk1oUunPPIJTeNLxq7D8UIZEOU6wW10X"/>
                    Continue with Google
                </button>
<!-- Footer Link -->
<footer class="mt-stack-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Already have an account? 
                        <a class="text-primary-container font-semibold hover:underline decoration-primary-container underline-offset-4 ml-1" href="#">Login</a>
</p>
</footer>
</div>
</section>
</main>
<style>
        /* Checkbox internal icon logic */
        input:checked + .check-icon {
            opacity: 1;
        }
        /* Custom scrollbar for premium feel */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #131313;
        }
        ::-webkit-scrollbar-thumb {
            background: #353534;
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4d4732;
        }
    </style>
</body></html>
