        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(30, 30, 30, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

            height: 2px;
            width: 30%;
            background-color: #ffd700;

<body class="bg-background text-on-surface font-body-md overflow-x-hidden min-h-screen flex flex-col">
<!-- Progress Indicator -->
<div class="fixed top-0 left-0 w-full h-[2px] bg-surface-container-highest z-[100]">
<div class="progress-line"></div>
</div>
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-50 bg-surface/10 backdrop-blur-md">
<nav class="flex justify-between items-center w-full px-margin-mobile md:px-stack-lg h-20 max-w-7xl mx-auto">
<div class="font-h1 text-h1 font-bold tracking-widest text-on-surface">SNITCH</div>
<div class="hidden md:flex gap-gutter items-center">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors" href="#">Collections</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors" href="#">New Arrivals</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors" href="#">Studio</a>
</div>
<div class="flex items-center gap-gutter">
<button class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-all active:scale-95">Login</button>
<button class="bg-primary-container text-on-primary-container px-inset-button py-2 rounded-full font-button text-button active:scale-95 transition-transform">Sign Up</button>
</div>
</nav>
</header>
<!-- Main Registration Section -->
<main class="relative flex-grow flex items-center justify-center min-h-screen pt-20 overflow-hidden">
<!-- Background Hero Image -->
<div class="absolute inset-0 z-0">
<img alt="Premium Streetwear Hero" class="w-full h-full object-cover object-center scale-105" data-alt="An editorial high-fashion streetwear shot of a model wearing a sophisticated oversized dark utility jacket in a minimalist urban setting with harsh, dramatic architectural lighting. The scene is dominated by deep blacks and cool grays, reflecting a premium and technical luxury brand aesthetic. Soft cinematic smoke drifts through the air, adding depth and a sense of atmosphere. The lighting highlights textures of high-quality fabrics against a brutalist concrete background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCDYVNjwnZwjvu4y5bw4qM0DDM_Q3Awq-5ukbjkpKfbrHJ8bLWR_m8z6nBJeG6TbB3ufTzHSsKQXhpsRog5T3T3pVQOIF-HpwCYCRIjGXfzRgB3E-Y2NFoL7vce0TZlV6Ljprd9jTCOM1j0cQK9EQ7b8IfrUsRvDe8JstgAWZGtoNHPVAZD671Ehwk5JoS_eVjRnGSB70_Mfgo4lahjJhsbnr_S503S8LzSlg1b_cAwSACa9USWFQC0I23C4Y1TH8jfJpGbGXXIJI_Z"/>
<div class="absolute inset-0 bg-black/60"></div>
</div>
<!-- Registration Card -->
<div class="relative z-10 w-full max-w-md mx-margin-mobile glass-card rounded-xl p-stack-lg shadow-2xl">
<div class="text-center mb-stack-lg">
<h1 class="font-h1 text-h1 text-on-surface mb-2">Join the Studio</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Experience the new standard of digital commerce.</p>
</div>
<form class="space-y-stack-md" onsubmit="return false;">
<!-- Full Name -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Full Name</label>
<input class="w-full bg-surface-container-low border border-surface-container-highest rounded-lg px-4 py-3 text-on-surface placeholder:text-on-secondary-fixed-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" placeholder="Enter your full name" type="text"/>
</div>
<!-- Email Address -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Email Address</label>
<input class="w-full bg-surface-container-low border border-surface-container-highest rounded-lg px-4 py-3 text-on-surface placeholder:text-on-secondary-fixed-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" placeholder="name@example.com" type="email"/>
</div>
<!-- Contact Number -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Contact Number</label>
<input class="w-full bg-surface-container-low border border-surface-container-highest rounded-lg px-4 py-3 text-on-surface placeholder:text-on-secondary-fixed-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<!-- Password -->
<div class="space-y-2 relative">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-surface-container-highest rounded-lg px-4 py-3 text-on-surface placeholder:text-on-secondary-fixed-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all pr-12" placeholder="Min. 8 characters" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Checkbox -->
<div class="flex items-center gap-3 py-2">
<input class="w-5 h-5 rounded border-surface-container-highest bg-surface-container-low text-primary-container focus:ring-primary-container focus:ring-offset-0" id="seller" type="checkbox"/>
<label class="font-label-sm text-label-sm text-on-surface-variant" for="seller">I want to sell</label>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary-container text-on-primary-container font-button text-button py-4 rounded-lg shadow-lg active:scale-[0.98] transition-all hover:bg-primary-fixed duration-300">
                    Sign Up
                </button>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-grow bg-surface-container-highest"></div>
<span class="font-label-sm text-label-sm text-on-secondary-fixed-variant">OR</span>
<div class="h-[1px] flex-grow bg-surface-container-highest"></div>
</div>
<!-- Social Login -->
<button class="w-full bg-transparent border-[1.5px] border-on-surface/20 text-on-surface font-button text-button py-4 rounded-lg flex items-center justify-center gap-3 hover:bg-white/5 active:scale-[0.98] transition-all">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
</form>
<div class="mt-stack-lg text-center">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary-container transition-colors" href="#">
                    Already have an account? <span class="text-primary-container font-semibold">Login</span>
</a>
</div>

<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary-container transition-colors" href="#">Terms of Service</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary-container transition-colors" href="#">Help Center</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary-container transition-colors" href="#">Contact</a>
</div>
<div class="font-label-sm text-label-sm text-on-secondary-fixed-variant">
                © 2024 SNITCH PREMIUM APPAREL. ALL RIGHTS RESERVED.
            </div>
</div>

</body></html>
